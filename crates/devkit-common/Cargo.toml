[package]
name = "devkit-common"
edition.workspace = true
version = "0.13.2" # x-release-please-version

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
fd-lock.workspace = true
glob.workspace = true
comfy-table.workspace = true
anstyle.workspace = true
indicatif.workspace = true
console.workspace = true
supports-hyperlinks.workspace = true
ureq.workspace = true
minijinja.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
interprocess = { workspace = true, optional = true }

[features]
daemon = ["dep:interprocess"]

[dev-dependencies]
# InMemoryTerm: lets tests drive a visible (non-hidden) MultiProgress and
# assert what actually reaches the terminal.
indicatif = { workspace = true, features = ["in_memory"] }

# Unix process primitives (signals, sessions); unavailable on Windows.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Win32 process primitives (handles, Toolhelp, console control).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
