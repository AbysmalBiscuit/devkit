; A transaction-mode pooler as strict as Supabase's: a server connection
; returns to the pool after every transaction with its session state
; discarded, and named prepared statements are not tracked, so a client that
; relies on one, or on SET, LISTEN or an advisory lock, fails here.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 4
max_client_conn = 200
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 1
ignore_startup_parameters = extra_float_digits
admin_users = postgres
