[package]
name = "devkit-todo"
description = "Agent todo lists: the model, the claim rule, node naming and the store trait"
edition.workspace = true
version = "0.14.12" # x-release-please-version

[dependencies]
anyhow.workspace = true
ambassador.workspace = true
serde = { workspace = true }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
devkit-common.workspace = true
devkit-config.workspace = true
devkit-vcs.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# The backend contract suite, `contract` and `contract_tests!`.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
devkit-todo = { path = ".", features = ["test-support"] }
