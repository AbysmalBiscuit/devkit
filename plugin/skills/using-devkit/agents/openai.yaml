interface:
  display_name: using-devkit
  short_description: Use when editing in a checkout other sessions share, when a write or command is denied naming a holder, before running a build or test by hand, for dev servers and ports, for workspaces, tracker tickets and PR review, and when editing `devkit.toml`. Covers `devkit`, `devrun`, `ticket`, `workspace`, `devkit pr`, `lockm`, `portm`.
policy:
  allow_implicit_invocation: true
