name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains the release PR and, on merge, creates the tag + GitHub Release.
  # Binaries are built and uploaded to that release by the separate `release`
  # workflow (cargo-dist), triggered by the tag push. The tag is pushed with a
  # PAT (RELEASE_PLEASE_TOKEN), not GITHUB_TOKEN, so the tag-push event actually
  # fires that workflow — a GITHUB_TOKEN push would not trigger it.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT (not the default GITHUB_TOKEN) so the release PR is attributed
          # to a real identity and the tag push triggers the release workflow;
          # pushes from GITHUB_TOKEN do not trigger CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The schema's `$id` is the `releases/latest/download` URL, which only
      # resolves once the file is a release asset. Attached here rather than by
      # the dist workflow: that file is autogenerated and a `dist generate`
      # would drop the step. The tag is checked out, not `main`, so the asset
      # matches the code that release ships.
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - if: ${{ steps.release.outputs.release_created }}
        name: Attach the devkit.toml JSON schema
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            schema/devkit-config.json --clobber

  # `prs_created` is true only when the release PR was opened or its changelog
  # changed, so docs, ci and chore merges and the release PR's own merge build
  # no nightly.
  nightly:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      contents: write
    # A newer push to main cancels the build of an older one.
    concurrency:
      group: nightly-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/nightly.yml
