name: nightly

# The `nightly` tag matches neither release-please's tag pattern nor the dist
# `Release` workflow's filter, so stable releases never see it.

on:
  # release-please calls this after a merge to main that changes the release PR.
  workflow_call:
  # On any other branch, builds every target and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "devkit") | .version')
          echo "version=${base}-nightly+${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - name: Move the nightly release
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run of an older commit's workflow must not move nightly back.
          # Main itself may be past this commit, since merges that leave the
          # release PR alone build no nightly.
          if [ "$(gh api "repos/$GH_REPO/compare/nightly...$GITHUB_SHA" --jq .status 2>/dev/null)" = behind ]; then
            echo "::notice::nightly is already past ${GITHUB_SHA}; leaving it alone"
            exit 0
          fi
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          devkit \`${VERSION}\`, built from ${GITHUB_SHA} on \`main\`.

          Each archive is replaced as its build finishes, so for a few minutes after a merge some may still hold the previous commit, and a target whose build failed keeps its previous archive until a later build succeeds. \`devkit --version\` names the commit a binary was built from.

          Install on Linux or macOS:

          \`\`\`sh
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/${GH_REPO}/releases/download/nightly/devkit-nightly-installer.sh | sh
          \`\`\`
          EOF
          if gh release view nightly >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --target "$GITHUB_SHA" --prerelease --latest=false --title "nightly ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create nightly --target "$GITHUB_SHA" --prerelease --latest=false --title "nightly ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          .github/nightly/publish.sh .github/nightly/devkit-nightly-installer.sh

  target:
    name: ${{ matrix.target }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    uses: ./.github/workflows/nightly-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      cross: ${{ matrix.cross || false }}
      version: ${{ needs.release.outputs.version }}
