name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml sets unstable options; stable rustfmt warns and ignores
      # them, so a stable check would pass on unformatted code.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Lint on both platform branches: cfg(windows) code (the sys backend and
        # the named-pipe transport) is invisible to a Linux-only clippy run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The taskwarrior todo tests run against taskwarrior 3.5 or later, the
      # release built on the taskchampion devkit embeds, which Homebrew ships.
      # Where `task` is missing they return early, so the other runners skip
      # them.
      - name: Install taskwarrior
        if: matrix.os == 'macos-latest'
        run: |
          brew install task
          task --version
          task --version | awk -F. '{ exit !($1 > 3 || ($1 == 3 && $2 >= 5)) }'
      - name: Test workspace
        run: cargo nextest run --workspace --no-fail-fast
      # nextest does not run doctests. The workspace has none today, so this
      # guards against a future one being silently skipped; one platform is
      # enough for that.
      - name: Doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc
      - name: Build without default features
        run: cargo build --workspace --no-default-features

  postgres:
    name: postgres todo backend and rules source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The Postgres tests return early without a database, so the test job
      # skips them. Here they run against Postgres directly and through a
      # transaction-mode PgBouncer that keeps no prepared statement, as
      # Supabase's pooler does.
      - name: Start Postgres and the pooler
        run: crates/devkit-todo-postgres/testdb/up.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Test the postgres todo backend and rules source
        run: cargo nextest run --workspace --no-fail-fast -E 'package(devkit-todo-postgres) | binary(todo_postgres) | binary(source_parity) | binary(rules_postgres)'
