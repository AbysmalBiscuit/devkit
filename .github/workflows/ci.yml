name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A pull request that changes only the files `skip` matches skips the Rust
  # jobs. Every other path, a new one included, runs them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        env:
          skip: '^(docs/|evals/|\.github/workflows/(release|release-please|codeql|nightly|nightly-target)\.yml$|dist-workspace\.toml$|release-please-config\.json$|\.release-please-manifest\.json$|(README|CHANGELOG|CODING_STANDARDS|AGENTS|CLAUDE)\.md$|LICENSE$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE "$skip"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml sets unstable options; stable rustfmt warns and ignores
      # them, so a stable check would pass on unformatted code.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .

  clippy:
    name: clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Lint on both platform branches: cfg(windows) code (the sys backend and
        # the named-pipe transport) is invisible to a Linux-only clippy run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}${{ matrix.partition && format(', {0}', matrix.partition) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # One job running every test nears the timeout on these runners.
        include:
          - { os: macos-latest, partition: 1/2 }
          - { os: macos-latest, partition: 2/2 }
          - { os: windows-latest, partition: 1/4 }
          - { os: windows-latest, partition: 2/4 }
          - { os: windows-latest, partition: 3/4 }
          - { os: windows-latest, partition: 4/4 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The taskwarrior todo tests run against taskwarrior 3.5 or later, the
      # release built on the taskchampion devkit embeds, which Homebrew ships.
      # Where `task` is missing they return early, so the other runners skip
      # them.
      - name: Install taskwarrior
        if: matrix.os == 'macos-latest'
        run: |
          brew install task
          task --version
          task --version | awk -F. '{ exit !($1 > 3 || ($1 == 3 && $2 >= 5)) }'
      # The signed-waiver tests run devkit in a user namespace, so that the
      # account home it trusts can be a test directory. Ubuntu's AppArmor
      # refuses unprivileged user namespaces by default.
      - name: Allow unprivileged user namespaces
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true
      - name: Test workspace
        run: cargo nextest run --workspace --no-fail-fast ${{ matrix.partition && format('--partition count:{0}', matrix.partition) || '' }}
      # nextest does not run doctests. The workspace has none today, so this
      # guards against a future one being silently skipped; one platform is
      # enough for that.
      - name: Doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc
      # Skipped on Windows to keep its job short, which leaves the Windows
      # side of the daemon feature's cfg split unbuilt with the feature off.
      # One partition per platform builds it.
      - name: Build without default features
        if: matrix.os != 'windows-latest' && matrix.partition != '2/2'
        run: cargo build --workspace --no-default-features

  postgres:
    name: postgres todo backend and rules source
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The test job skips the database tests. Here they run directly, through
      # a strict transaction-mode PgBouncer, and over PostgREST, as Supabase.
      - name: Start Postgres, the pooler and PostgREST
        run: crates/devkit-todo-postgres/testdb/up.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Test the postgres todo backend and rules source
        run: cargo nextest run --workspace --no-fail-fast -E 'package(devkit-todo-postgres) | package(devkit-todo-supabase) | binary(todo_postgres) | binary(todo_supabase) | binary(source_parity) | binary(rules_postgres)'

  # The one required check. A skipped matrix job reports no check under its
  # expanded names, so branch protection requires this job instead.
  ci:
    name: ci
    if: always()
    needs: [changes, fmt, audit, plugin, clippy, test, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
