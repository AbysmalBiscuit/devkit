name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml sets unstable options; stable rustfmt warns and ignores
      # them, so a stable check would pass on unformatted code.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Lint on both platform branches: cfg(windows) code (the sys backend and
        # the named-pipe transport) is invisible to a Linux-only clippy run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Test workspace
        run: cargo nextest run --workspace --no-fail-fast
      # nextest does not run doctests. The workspace has none today, so this
      # guards against a future one being silently skipped; one platform is
      # enough for that.
      - name: Doc tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc
      - name: Build without default features
        run: cargo build --workspace --no-default-features

  cloud:
    name: cloud agent scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The hooks are tested against the devkit this commit builds rather than
      # the last release, so a change that breaks a commit task fails here
      # instead of after a tag. `install-links` supplies the command names the
      # startup presence check looks for.
      - name: Build devkit and its command links
        run: |
          cargo build --bin devkit
          target/debug/devkit install-links
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        working-directory: .agents/skills/cloud
        run: uv run --frozen ruff check .
      - name: Type check
        working-directory: .agents/skills/cloud
        run: uv run --frozen pyrefly check
      # The system interpreter, not uv's virtualenv: that is how Claude runs
      # these hooks on a cloud VM, and the scripts depend on nothing installed.
      # Verbose output so a skipped test names the capability it wanted.
      - name: Test cloud hooks
        run: python3 -B .agents/skills/cloud/scripts/cloud.test.py -v
