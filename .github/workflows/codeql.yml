name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '16 4 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # devkit is a local CLI: argv, env and config are the operator's own
          # input, so the injection queries' untrusted-source model does not apply.
          config: |
            query-filters:
              - exclude:
                  id:
                    - rust/path-injection
                    - rust/command-line-injection
                    - py/path-injection
                    - py/command-line-injection

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
