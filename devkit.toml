#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json

[defaults]
baseline_ref = "origin/main"
pr_create_state = "ready"
pr_proof_variable = "proof"

# The `origin` remote is an SSH alias, so nothing about it names github.com and
# the repository cannot be derived from it. Both are spelled out instead.
[github]
issues_repo = "AbysmalBiscuit/devkit"
project = 3

[forge]
kind = "github"
repo = "AbysmalBiscuit/devkit"

# A globally exported LINEAR_API_KEY would otherwise make detection resolve
# Linear for this project, which has nothing in Linear.
[tracker]
kind = "github"

[harness]
enforce_writes = true
enforce_commands = true

[harness.commands.worktree-add]
programs = ["git"]
args = ["worktree", "add"]
reason = "Create worktrees with devkit: workspace setup --summary --slug [branch-name]"

[harness.commands.worktree-remove]
programs = ["git"]
args = ["worktree", "remove"]
reason = "Remove worktrees with devkit: workspace end [branch-name]"

[harness.commands.gh-issue-create]
programs = ["gh"]
args = ["issue", "create"]
reason = "file tickets with `devkit ticket create` so the ticket template applies"

# Ticket writes through a tracker's MCP must carry text `devkit ticket render`
# produced. The templates stay at their defaults for now.
[harness.ticket_tools.linear]
servers = ["*linear*"]
tools = ["save_issue"]
absent = ["id"]
title = "title"
body = "description"
body_patch = ["patch"]

[harness.ticket_tools.github]
servers = ["*github*"]
tools = ["issue_write"]
equals = { method = "create" }
title = "title"
body = "body"

[todo]
hold_stop = "subagents"

[tasks.audit]
description = "Check Cargo.lock against the RustSec advisory database"
run = ["cargo", "audit"]
guard = true

[tasks.build]
description = "Build the workspace"
run = ["cargo", "build", "--workspace", "--locked"]
guard = true

[tasks.build-release]
description = "Build the workspace with release optimizations"
run = ["cargo", "build", "--workspace", "--release", "--locked"]
guard = true

[tasks.check]
description = "Check all workspace targets and features"
run = [
    "cargo",
    "check",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
]
guard = true

[tasks.test]
description = "Run workspace tests with nextest"
run = [
    "cargo",
    "nextest",
    "run",
    "--workspace",
    "--all-features",
    "--locked",
    "--no-fail-fast",
]
guard = true

[tasks.test-doc]
description = "Run workspace documentation tests"
run = ["cargo", "test", "--doc", "--workspace", "--all-features", "--locked"]
guard = true

[tasks.eval]
description = "Grade isolated Claude agents on a case's agent-facing text (billed)"
run = ["bash", "evals/run.sh", "{{ eval_case }}"]

[tasks.eval-scenario]
description = "Grade isolated Claude agents on what they do with the plugin loaded (billed)"
run = ["bash", "evals/scenario.sh", "{{ scenario }}"]

[tasks.rebase-add]
description = "Mark resolved rebase conflicts by staging the given paths"
guard = false
run = ["git", "--literal-pathspecs", "add", "--", { split = "{{ files }}", on = "," }]

# `name` exists because minijinja's variable analysis skips an expression that
# is sliced, and `--arg slug=...` is refused for a name it does not see.
[templates]
branch = '''
{%- set key = ticket or issue -%}
{%- set id = (key | lower ~ "-") if key else "" -%}
{%- set name = slug | trim | lower | replace(" ", "-") -%}
{{ id }}{{ name[:46 - (id | length)] | trim("-") }}
'''
worktree_dir = '''
{%- set key = ticket or issue -%}
{%- set id = (key | lower ~ "-") if key else "" -%}
{%- set name = slug | trim | lower | replace(" ", "-") -%}
{{ id }}{{ name[:46 - (id | length)] | trim("-") }}
'''

# PR body for `devkit pr create`; `input` comes from `--pr-body`.
# The TL;DR heading renders only when no `agent_model` or `agent_harness` is set.
pr_body = '''
{%- set own = (ticket_magic_word ~ " " ~ ("#" if ticket and ticket[0] in "0123456789" else "") ~ ticket) if ticket else "" -%}
{%- set ref_lines = ((own ~ ";" ~ refs) if own else refs) | split(";") | map("trim") | reject("eq", "") | list -%}
{%- set agent = agent_model or agent_harness -%}
{%- if not agent -%}
## TL;DR (human written)
{{ human_tldr }}
{%- endif %}
{%- if ref_lines %}
{%- if not agent %}

---

{% endif %}{{ ref_lines | join("\n") }}
{%- endif %}
{%- if agent %}
{%- if ref_lines %}

---

{% endif %}## Agent summary
{%- endif %}

{{ input | trim }}
{%- set caveats = [["departures", departures], ["loose ends", loose_ends], ["assumptions", assumptions]] %}
{%- set filled = [departures, loose_ends, assumptions] | map("trim") | reject("eq", "") | reject("eq", "**None**") | list %}
{%- if agent or filled %}

## Caveats
{%- for kind, value in caveats %}

{{ value | trim if value | trim not in ["", "**None**"] else "**0 " ~ kind ~ "**" }}
{%- endfor %}
{%- endif %}
{%- if agent or conceptual_changes | trim %}

## Conceptual Changes

{{ conceptual_changes | trim or "**None**" }}
{%- endif %}
{%- if proof | trim %}

## Proof

{{ proof | trim }}
{%- endif %}
{%- if change_risk | trim or change_risk_reason | trim or door | trim or blast_radius | trim %}

## Change Risk
{%- if change_risk | trim %}

**Change risk:** {{ change_risk | trim }}
{%- endif %}
{%- if change_risk_reason | trim %}

**Classifier:** {{ change_risk_reason | trim }}
{%- endif %}
{%- if door | trim %}

**Door:** {{ door | trim }}
{%- endif %}
{%- if blast_radius | trim %}

**Blast Radius:** {{ blast_radius | trim }}
{%- endif %}
{%- endif %}
{%- if agent %}

---
{%- if implemented_by | trim %}

Implemented by {{ implemented_by | trim }}
{%- endif %}

🤖 Generated with {{ agent_model }}{% if agent_model and agent_harness %} via {% endif %}{{ agent_harness }}
{%- endif %}
'''

# Ticket body for `devkit ticket render`, `ticket create` and `ticket edit`;
# `input` comes from `--body`. Laid out as a prompt to the agent that works
# the ticket: the task, its finish line, when to stop, then what it may not
# touch.
ticket_body = '''
{{- input | trim }}
{%- if done_when | trim %}

## Done when

{{ done_when | trim }}
{%- endif %}
{%- if stop_and_ask | trim %}

## Stop and ask if

{{ stop_and_ask | trim }}
{%- endif %}
{%- if out_of_scope | trim %}

## Out of scope

{{ out_of_scope | trim }}
{%- endif %}
{%- if context | trim %}

## Context

{{ context | trim }}
{%- endif %}
'''

[templates.variables]
eval_case = "brief"
scenario = "all"

files = { required = "always", description = "Comma-separated paths to stage, whitespace kept in each" }
coauthors = { default = "", required = "agents", description = "`Name <email>` of each `Co-authored-by` trailer, one `--coauthor` apiece. Claude Code: `<full model name, e.g. Claude Opus 5> <noreply@anthropic.com>`. Codex: `Codex <full model name, e.g. GPT-6 Astra> <noreply@openai.com>`. Grok Build: `<full model name, e.g. Grok 4.7> <261865991+grok-by-xai[bot]@users.noreply.github.com>`" }

human_tldr = { default = "", description = "A human's summary, written after the PR opens; agents leave it unset. An agent's PR body has no TL;DR section for `devkit pr edit` to fill, so a human adds one there by editing the body on GitHub" }
proof = { default = "", required = "agents", description = "One unindented line per `Done when` item, starting with its number in the order the ticket lists them (`1. ✅ test foo_refuses_gap`, `2. ⚠️ **Not observed:** command X needs a database`), or with no ticket one line per claim the summary makes; a numbered line indented two columns or more answers nothing. After the number, each line opens with one outcome: `✅ ` (done, and a run showed it), `⚠️ **Not observed:**`, `🔀 **Done differently:**`, `🚧 **Partly done:**` or `❌ **Not done:**`. Then it gives the evidence that its item holds: the test that covers it, a command and its output, or a screenshot or video under `.devkit/proof/` referenced by that local path (`![after](./.devkit/proof/after.png)`, a video embedded the same way alone in its paragraph) and passed to `--attach` on `devkit pr create`, or on `devkit pr edit` once the PR is open" }

done_when = { default = "", required = "agents", description = "Checkbox list (`- [ ] ...`) of checks that prove the ticket is done: a command that passes, behaviour anyone can see. For an investigation, the deliverable and where it goes. End each item with the proof its PR must show: `(proof: test <name>)`, `(proof: command and its output)`, `(proof: screenshot)` or `(proof: video)`. A bug item whose test fails without the fix ends `(proof: repro <selector>)` instead. The repro gate checks that only when `[pr.gates] repro_task` names a task. `--body` holds only the task: what to change and why, as behaviour rather than steps" }
stop_and_ask = { default = "", description = "Situations particular to this ticket where the agent working it must stop and ask; being blocked and destructive actions are already covered. Leave unset when there are none" }
out_of_scope = { default = "", description = "Adjacent work that must not happen under this ticket, even when it looks related" }
context = { default = "", description = "Links, error output, the parent and blocking tickets. Attach screenshots rather than retyping them" }

# Supplied by the render context in a worktree `workspace setup` created; declared
# so the templates also render outside one.
ticket = { default = "", description = "The worktree's own ticket id, filled in a ticket worktree; pass it only outside one" }
issue = { default = "", description = "Old name of `ticket`" }
ticket_magic_word = { default = "Closes", description = "Keyword on the worktree's own ticket line: `Refs` when this branch does not finish the ticket" }
issue_magic_word = { default = "", description = "Old name of `ticket_magic_word`, which it overrides when set" }
refs = { default = "", description = "Every other ticket line, `;`-separated, each with its own keyword: `Closes #12; Refs #90`" }

agent_model = { default = "", required = "agents", description = "Full name of the model that did the work, e.g. `Claude Opus 5`" }
agent_harness = { default = "", required = "agents", description = "Markdown link to the harness, e.g. `[Claude Code](https://claude.com/claude-code)`" }
implemented_by = { default = "", description = "One prose line naming who did which part, when several agents or people did the work" }

departures = { default = "", description = "What the branch does that the ticket did not ask for. Renders `**None**` on an agent PR when unset" }
loose_ends = { default = "", description = "What the branch knowingly leaves stale or unfinished. Renders `**None**` on an agent PR when unset" }
assumptions = { default = "", description = "The choices the branch made where the ticket and the human gave no answer. Renders `**None**` on an agent PR when unset" }
conceptual_changes = { default = "", description = "The concepts the branch adds or changes, without the heading. Renders `**None**` on an agent PR when unset" }
change_risk = { default = "", description = "`low`, `medium` or `high`; workcell sets it, so agents leave it unset. The template adds the `**Change risk:**` label" }
change_risk_reason = { default = "", description = "The change-risk classifier's answer and its one-line reason; workcell sets it, so agents leave it unset. The template adds the `**Classifier:**` label" }
door = { default = "", description = "`➡️ one-way` or `&#x2194;&#xFE0F; two-way`: whether a revert undoes the change. The template adds the `**Door:**` label" }
blast_radius = { default = "", description = "The widest scope a bad merge reaches, then one bullet per risk. The template adds the `**Blast Radius:**` label" }

[tasks.fmt]
description = "Format the workspace with nightly rustfmt"
run = ["cargo", "+nightly", "fmt", "--all"]
guard = true

[tasks.fmt-check]
description = "Check workspace formatting with nightly rustfmt"
run = ["cargo", "+nightly", "fmt", "--all", "--", "--check"]
guard = true

[tasks.lint]
description = "Run clippy with warnings denied"
run = [
    "cargo",
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--locked",
    "--",
    "-D",
    "warnings",
]
guard = true
env = { ZCCACHE_PATH_REMAP = "off" }

[tasks.docs]
description = "Build workspace API documentation"
run = ["cargo", "doc", "--workspace", "--no-deps", "--all-features", "--locked"]
guard = true

[tasks.clean]
description = "Remove Cargo build artifacts"
run = ["cargo", "clean"]
guard = true

[tasks.verify]
description = "Check formatting, lint, and run tests including documentation tests"
steps = [
    { task = "fmt-check" },
    { task = "lint" },
    { task = "test" },
    { task = "test-doc" },
]
