[package]
name = "devkit"
description = "Run a fleet of coding agents on one machine without collisions"
edition.workspace = true
version = "0.14.16" # x-release-please-version
license = "GPL-3.0-or-later"
repository = "https://github.com/AbysmalBiscuit/devkit"

# The supervisor daemon needs the port-registry daemon backend; gate its bin on
# the feature so `--no-default-features` builds still produce the other tools.
[[bin]]
name = "devkitd"
path = "src/bin/devkitd/main.rs"
required-features = ["daemon"]

[features]
default = ["daemon"]
daemon = ["devkit-ports/daemon", "devkit-locks/daemon", "devkit-mcp/daemon"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
serde = { workspace = true }
serde_json.workspace = true
schemars.workspace = true
rpassword.workspace = true
toml.workspace = true
fd-lock.workspace = true
interprocess.workspace = true
chrono.workspace = true
textplots.workspace = true
rgb.workspace = true
indicatif.workspace = true
devkit-config.workspace = true
devkit-common.workspace = true
devkit-command.workspace = true
devkit-ports.workspace = true
devkit-locks.workspace = true
devkit-ticket.workspace = true
devkit-mcp.workspace = true
devkit-docs.workspace = true
devkit-rules.workspace = true
devkit-postgres.workspace = true
devkit-supabase.workspace = true
devkit-timing.workspace = true
devkit-todo.workspace = true
devkit-todo-builtin.workspace = true
devkit-todo-taskchampion.workspace = true
devkit-todo-postgres.workspace = true
devkit-todo-supabase.workspace = true
ambassador.workspace = true
pabal.workspace = true
same-file.workspace = true
strum.workspace = true

[dev-dependencies]
tempfile.workspace = true
# A collapsed diff when the committed JSON schema drifts from the config types.
similar = "2"
devkit-common = { workspace = true, features = ["test-support"] }
devkit-git = { workspace = true, features = ["test-support"] }
devkit-supabase = { workspace = true, features = ["test-support"] }
same-file.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
rusqlite.workspace = true

# Used only by the Unix-only supervision integration test (POSIX signals).
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[workspace]
resolver = "3"
members = ["crates/devkit-config", "crates/devkit-common", "crates/devkit-ports", "crates/devkit-locks", "crates/devkit-rules", "crates/devkit-ticket", "crates/devkit-mcp", "crates/devkit-docs", "crates/devkit-command", "crates/devkit-vcs", "crates/devkit-git", "crates/devkit-timing", "crates/devkit-todo", "crates/devkit-todo-builtin", "crates/devkit-todo-taskchampion", "crates/devkit-todo-postgres", "crates/devkit-todo-supabase", "crates/devkit-postgres", "crates/devkit-supabase"]

[workspace.package]
edition = "2024"
version = "0.1.0" # x-release-please-version

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "wrap_help"] }
clap_complete = "4"
clap_complete_nushell = "4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
jsonc-parser = { version = "0.26", features = ["serde"] }
toml = "1"
textplots = { version = "0.8", default-features = false }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
rgb = "0.8"
serde_yaml_ng = "0.10"
fd-lock = "4"
glob = "0.3"
interprocess = { version = "2", default-features = false }
jwalk = "0.9"
nix = { version = "0.29", features = ["signal", "process", "term"] }
same-file = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }
comfy-table = { version = "7", features = ["custom_styling"] }
anstyle = "1"
indicatif = "0.17"
# Same 0.15 line indicatif resolves to: progress code sets this crate's global
# colour flag, which only works if both link the same console build.
console = "0.15"
supports-hyperlinks = "3"
strum = { version = "0.27", features = ["derive"] }
pabal = { version = "0.2.2", features = ["clap"] }
ambassador = "0.5.1"
# The 0.12 line taskchampion builds on, so the binary links one HTTP stack.
# Roots come from `http::tls_config`, handed in as a preconfigured rustls config.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls-manual-roots"] }
# An embedded taskchampion replica, on the 3.1 line taskwarrior 3.5 links, so
# the replica matches the `task` a person reads the lists with. Sync builds its
# own reqwest client, so its roots come from `tls-native-roots`.
taskchampion = { version = "3.1", default-features = false, features = ["server-sync", "server-local", "storage-sqlite", "bundled", "tls-native-roots"] }
# Drives taskchampion's async API. Sync's HTTP client needs the timer driver.
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
# The Postgres todo backend's client. Its own unnamed statements
# (`query_typed`) pass through a transaction-mode pooler that keeps no
# prepared statement.
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
# reqwest's TLS stack. Default features off: they pull aws-lc-rs, reqwest uses ring.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
# Already in the tree under reqwest's TLS stack, so taking it directly for
# `harness_log`'s digest adds no crate to the lock.
ring = "0.17"
# PKCE verifiers and challenges for Supabase Auth sign-in.
base64 = "0.22"
rpassword = "7"
rayon = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
devkit-config = { path = "crates/devkit-config" }
devkit-common = { path = "crates/devkit-common" }
devkit-ports = { path = "crates/devkit-ports" }
devkit-locks = { path = "crates/devkit-locks" }
devkit-ticket = { path = "crates/devkit-ticket" }
devkit-mcp = { path = "crates/devkit-mcp" }
toml_edit = { version = "0.25", features = ["serde"] }
devkit-docs = { path = "crates/devkit-docs" }
devkit-rules = { path = "crates/devkit-rules" }
devkit-command = { path = "crates/devkit-command" }
devkit-vcs = { path = "crates/devkit-vcs" }
devkit-git = { path = "crates/devkit-git" }
devkit-timing = { path = "crates/devkit-timing" }
devkit-todo = { path = "crates/devkit-todo" }
devkit-todo-builtin = { path = "crates/devkit-todo-builtin" }
devkit-todo-taskchampion = { path = "crates/devkit-todo-taskchampion" }
devkit-todo-postgres = { path = "crates/devkit-todo-postgres" }
devkit-todo-supabase = { path = "crates/devkit-todo-supabase" }
devkit-postgres = { path = "crates/devkit-postgres" }
devkit-supabase = { path = "crates/devkit-supabase" }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-fish = "3.6"
tempfile = "3"
# The SQLite rule store `repo-rules-agent` writes. The 0.39 line taskchampion
# already links, bundled the same way, so the binary carries one SQLite.
rusqlite = { version = "0.39", features = ["bundled"] }
# Storage keys for rules and sources added to a SQLite rule store.
uuid = { version = "1", features = ["v4"] }
frizbee = "0.13"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3        # tools do little compute; keep the registry/diff hot paths fast
lto = "thin"         # cross-crate inlining across the workspace libs
codegen-units = 1    # better optimization at the cost of compile time
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
