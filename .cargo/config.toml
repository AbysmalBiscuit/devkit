# Every `cargo test`/`cargo run` in this workspace inherits this into the
# environment of the compiled binary, which every `std::process::Command`
# it spawns inherits in turn (verified empirically — Cargo's [env] table
# reaches the runtime env of the process it execs, not just build scripts).
#
# `devkit`'s `links::ensure_current` runs an automatic linking pass on every
# invocation of every shim (see the `feat(devkit): link shim names
# automatically on a version change` commit). Left unset, every test that
# spawns the built `devkit` binary or one of its shim hardlinks — which is
# most of this workspace's integration tests — would trigger that pass
# against the developer's *real* `~/.local/state/devkit` and hardlink real
# shim names into the *real* `target/{debug,release}` next to the binary,
# racing any concurrent real devkit invocation on the same machine and, in
# the worst case, deleting a build artifact a probe judges foreign.
#
# The handful of tests in `tests/install_links.rs` that exercise
# `ensure_current` itself remove this var from their own `Command` with
# `.env_remove("DEVKIT_SKIP_AUTOLINK")` before spawning.
[env]
DEVKIT_SKIP_AUTOLINK = "1"
