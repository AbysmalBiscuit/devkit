#:schema https://github.com/AbysmalBiscuit/devkit/releases/latest/download/devkit-config.json
#:toml-version 1.1

# Placed at the repository root by harnessup: the agent policy a local session
# gets from its user config.

[harness.commands.git-commit]
programs = ["git"]
args = ["commit"]
reason = """Commit with `devkit commit`, which commits exactly what it names and leaves other sessions' staging alone:
  devkit commit --files src/a.rs src/b.rs --subject 'fix(scope): imperative subject' --coauthor '<model> <email>'
Part of a file: write those hunks to a patch against HEAD and pass `--patch <file>` instead of `--files`.
The last commit's message: `devkit commit --amend` with the message flags.
`devkit commit -h` describes every flag."""

[harness.commands.git-add]
programs = ["git"]
args = ["add"]
reason = """Commit without staging: `devkit commit --files <paths>` commits the paths it names, and `devkit commit --patch <file>` commits part of a file.
Rebase conflicts: `devrun task rebase-add --arg files='src/a.rs,src/b.rs'`, then `git rebase --continue`.
`devkit config tasks <task>` describes every arg."""

[harness.commands.pr-create]
programs = ["gh"]
args = ["pr", "create"]
reason = """Open the PR with devkit, which renders the body from the `pr_body` template:
  devkit pr create --pr-title 'type(scope): subject' --pr-body '<markdown>' --arg proof='<markdown>' --attach <media path> --arg agent_model='...' --arg agent_harness='...'
`--pr-body` is the agent summary and `proof` the evidence for each `Done when` item, one unindented line per item starting with its number (`1. test foo_refuses_gap`); the template adds the TL;DR heading and this worktree's closing line. Pass `--draft` when a draft was asked for.
`devkit template show pr_body` describes every `--arg`; `devkit template render pr_body --arg input='<markdown>' ...` previews the body."""

[harness.commands.issue-edit-body]
programs = ["gh"]
args = ["issue", "edit", "**", "--body*"]
reason = """Rewrite the issue with devkit, which renders the body from the `issue_body` template:
  devkit ticket edit <number> --body '<the task>' --arg done_when='- [ ] ...'
`--title` also replaces the title; without it the issue keeps its own.
`devkit template show issue_body` describes every `--arg`."""

# The short spellings of `--body` and `--body-file`.
[harness.commands.issue-edit-body-b]
programs = ["gh"]
args = ["issue", "edit", "**", "-b*"]
reason = """Rewrite the issue with devkit, which renders the body from the `issue_body` template:
  devkit ticket edit <number> --body '<the task>' --arg done_when='- [ ] ...'
`--title` also replaces the title; without it the issue keeps its own.
`devkit template show issue_body` describes every `--arg`."""

[harness.commands.issue-edit-body-f]
programs = ["gh"]
args = ["issue", "edit", "**", "-F*"]
reason = """Rewrite the issue with devkit, which renders the body from the `issue_body` template:
  devkit ticket edit <number> --body '<the task>' --arg done_when='- [ ] ...'
`--title` also replaces the title; without it the issue keeps its own.
`devkit template show issue_body` describes every `--arg`."""

# devkit has no PR edit verb to redirect to, so these warn rather than block.
[harness.commands.pr-edit-body]
programs = ["gh"]
args = ["pr", "edit", "**", "--body*"]
action = "warn"
reason = """Pass only a body rendered from the `pr_body` template:
  devkit pr render --pr-title 'type(scope): subject' --pr-body '<markdown>' --arg proof='<markdown>' --arg agent_model='...' --arg agent_harness='...' | jq -r .body > body.md
  gh pr edit <number> --body-file body.md
`devkit template show pr_body` describes every `--arg`."""

# The short spellings of `--body` and `--body-file`.
[harness.commands.pr-edit-body-b]
programs = ["gh"]
args = ["pr", "edit", "**", "-b*"]
action = "warn"
reason = """Pass only a body rendered from the `pr_body` template:
  devkit pr render --pr-title 'type(scope): subject' --pr-body '<markdown>' --arg proof='<markdown>' --arg agent_model='...' --arg agent_harness='...' | jq -r .body > body.md
  gh pr edit <number> --body-file body.md
`devkit template show pr_body` describes every `--arg`."""

[harness.commands.pr-edit-body-f]
programs = ["gh"]
args = ["pr", "edit", "**", "-F*"]
action = "warn"
reason = """Pass only a body rendered from the `pr_body` template:
  devkit pr render --pr-title 'type(scope): subject' --pr-body '<markdown>' --arg proof='<markdown>' --arg agent_model='...' --arg agent_harness='...' | jq -r .body > body.md
  gh pr edit <number> --body-file body.md
`devkit template show pr_body` describes every `--arg`."""

# The GitHub MCP server a cloud session carries opens and edits PRs; their text
# must come from `devkit pr render` in the same session.
[harness.pr_tools.github-create]
servers = ["*github*"]
tools = ["create_pull_request"]
title = "title"
body = "body"

[harness.pr_tools.github-update]
servers = ["*github*"]
tools = ["update_pull_request"]
absent = ["pullNumber"]
title = "title"
body = "body"

# No one watches a cloud session, so its stop hook holds the main agent to
# its open todos too, not only sub-agents.
[todo]
hold_stop = "always"

# Roles for the issue-manage workflow. Workers select their role with
# `devkit todo role <name>` because they spawn as generic subagents.
[todo.roles.manager]
scope = "workspace"

[todo.roles.implementer]
scope = "agent"
parent = "manager"

[todo.roles.verifier]
scope = "agent"
parent = "manager"

[todo.roles.receiver]
scope = "agent"
parent = "manager"
